name: Validate EKS Platform

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - eks-production-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init without remote backend
        working-directory: infra/envs/prod-demo
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/envs/prod-demo
        run: terraform validate

  helm:
    name: Helm lint and render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Helm lint church app
        run: >-
          helm lint helm/apps/church-app
          -f helm/apps/church-app/values.yaml
          -f helm/apps/church-app/values-aws-generated.yaml
          -f helm/apps/church-app/values-image-tags.yaml

      - name: Render church app manifests
        run: >-
          helm template church-app helm/apps/church-app
          --namespace church-prod
          -f helm/apps/church-app/values.yaml
          -f helm/apps/church-app/values-aws-generated.yaml
          -f helm/apps/church-app/values-image-tags.yaml
          > /tmp/church-app-rendered.yaml

      - name: Confirm rendered manifests are non-empty
        run: test -s /tmp/church-app-rendered.yaml

  scripts:
    name: Shell script checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck scripts
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck
