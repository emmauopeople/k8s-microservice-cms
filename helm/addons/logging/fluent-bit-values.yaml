# Portfolio demo values for Fluent Bit.
# Ships Kubernetes container logs to in-cluster OpenSearch.

kind: DaemonSet

serviceAccount:
  create: true
  name: fluent-bit

rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceMonitor:
  enabled: true
  namespace: logging

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On
        Refresh_Interval 10

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Merge_Log_Key app_log
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    [FILTER]
        Name modify
        Match kube.*
        Add cluster church-prod-demo-eks
        Add environment prod-demo

  outputs: |
    [OUTPUT]
        Name opensearch
        Match kube.*
        Host opensearch.logging.svc.cluster.local
        Port 9200
        Index kubernetes
        Logstash_Format On
        Logstash_Prefix kubernetes
        Suppress_Type_Name On
        Retry_Limit False
        tls Off

  customParsers: |
    [PARSER]
        Name pino_json
        Format json
        Time_Key time
        Time_Keep On
