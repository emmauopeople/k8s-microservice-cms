apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch-dashboards
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://opensearch-project.github.io/helm-charts/
    chart: opensearch-dashboards
    targetRevision: "3.7.0"
    helm:
      releaseName: opensearch-dashboards
      valueFiles: []
      values: |
        fullnameOverride: opensearch-dashboards
        opensearchHosts: "http://opensearch.logging.svc.cluster.local:9200"
        replicaCount: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        service:
          type: ClusterIP
          port: 5601
        ingress:
          enabled: false
        config:
          opensearch_dashboards.yml: |
            server.host: 0.0.0.0
            opensearch.hosts: ["http://opensearch.logging.svc.cluster.local:9200"]
            opensearch_security.enabled: false
