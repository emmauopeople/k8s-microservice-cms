apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "*"
    helm:
      releaseName: monitoring
      valueFiles: []
      values: |
        fullnameOverride: kube-prometheus-stack

        prometheusOperator:
          enabled: true

        kubeStateMetrics:
          enabled: true

        nodeExporter:
          enabled: true

        grafana:
          enabled: true
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            type: pvc
            storageClassName: gp3
            accessModes:
              - ReadWriteOnce
            size: 5Gi
          service:
            type: ClusterIP
          ingress:
            enabled: false
          grafana.ini:
            server:
              root_url: https://grafana.eks.gestionparoissiale.org
            analytics:
              check_for_updates: false

        alertmanager:
          enabled: true
          alertmanagerSpec:
            replicas: 1
            retention: 120h
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 2Gi

        prometheus:
          enabled: true
          prometheusSpec:
            replicas: 1
            retention: 3d
            retentionSize: 8GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                cpu: 1000m
                memory: 2Gi
          service:
            type: ClusterIP

        thanosRuler:
          enabled: false
